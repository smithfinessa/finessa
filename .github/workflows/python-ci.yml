name: Finessa Python CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py services tests
      - name: Run full unit and integration suite
        env:
          FINESSA_AI_ENABLED: '0'
          FINESSA_CLOUD_ENABLED: '0'
          FINESSA_SECRET: ci-only-not-for-deployment
        run: python -m unittest discover -s tests -v
