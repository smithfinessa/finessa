name: Security regression tests
on:
  pull_request:
    paths:
      - 'app.py'
      - 'config.py'
      - 'templates/**'
      - 'static/js/**'
      - 'tests/**'
      - '.github/workflows/security-regressions.yml'
  push:
    branches: [main]
jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run security regressions
        env:
          FINESSA_ACCESS_PASSWORD: ci-test-password
        run: python -m unittest discover -s tests -p 'test_security_regressions.py' -v
