{% extends 'base.html' %}{% block content %}<h1>Authority index</h1><form><input name="q" value="{{term}}" placeholder="case, statute, issue"><select name="jurisdiction"><option value="">All</option>{% for j in jurisdictions %}<option value="{{j.code}}" {% if jur==j.code %}selected{% endif %}>{{j.code}}</option>{% endfor %}</select><button>Search</button></form>{% for a in authorities %}<section class="card"><h2>{{a.title}}</h2><p>{{a.citation or ''}} · {{a.jurisdiction_code}} · {{a.verification_status}}</p><p>{{a.summary or ''}}</p>{% if a.source_url %}<p><a href="{{a.source_url}}" rel="noopener">Source</a></p>{% endif %}</section>{% else %}<p>No matches.</p>{% endfor %}{% endblock %}
