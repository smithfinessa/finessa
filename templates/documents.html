{% extends 'base.html' %}{% block content %}<h1>Document intelligence — {{case.case_name}}</h1>{% for e in evidence %}<section class="card"><strong>{{e.original_filename}}</strong><p>{{e.latest_class or 'Not analyzed'}}</p><form method="post" action="/cases/{{case.id}}/evidence/{{e.id}}/analyze"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Analyze</button></form></section>{% else %}<p>Upload evidence in the case workspace first.</p>{% endfor %}{% endblock %}
