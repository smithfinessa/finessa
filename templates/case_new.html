{% extends 'base.html' %}{% block content %}<h1>Create case workspace</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Case name <input name="case_name" required></label><label>Jurisdiction <select name="jurisdiction_code">{% for j in jurisdictions %}<option value="{{j.code}}">{{j.name}}</option>{% endfor %}</select></label><label>Proceeding <select name="proceeding_type"><option>CRIMINAL</option><option>CIVIL</option><option>POST_CONVICTION</option><option>HABEAS</option></select></label><label>Court <input name="court_name"></label><label>Case number <input name="case_number"></label><label>Procedural posture <input name="procedural_posture"></label><label>Notes <textarea name="notes"></textarea></label><button>Create</button></form>{% endblock %}
